packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de instalación: se decide uno a uno, no en bloque.
#
# esbuild los necesita para enlazar su binario nativo y lo usan tsx, vitest y
# drizzle-kit; protobufjs genera código al instalarse. cpu-features y ssh2 son
# optimizaciones nativas opcionales de testcontainers que funcionan igual en
# JavaScript puro, y el script de @scarf/scarf —que llega arrastrado por
# swagger-ui-dist— envía telemetría de uso al proveedor. Cuantos menos scripts
# se ejecuten al instalar, menos superficie de cadena de suministro.
allowBuilds:
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false

# pnpm rechaza paquetes publicados hace menos de un día. Cuando uno cae dentro
# de esa ventana se baja a la versión anterior en lugar de excluirlo de la
# política: una salvaguarda de cadena de suministro no se relaja para salir del
# paso.
overrides:
  zod: 4.4.3
