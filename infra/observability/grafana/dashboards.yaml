# Los paneles se aprovisionan desde el repositorio, no se crean a mano en la
# interfaz: un panel que solo existe en el Grafana de alguien se pierde con su
# portátil (TRD §13).
apiVersion: 1

providers:
  - name: 'App Foundry'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    # Se recargan solos al cambiar el fichero, para poder iterar sin reiniciar.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
