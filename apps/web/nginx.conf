server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # La aplicación resuelve sus propias rutas, así que cualquier ruta que no sea
  # un fichero devuelve el index: sin esto, recargar en una ruta interna daría
  # un 404 del servidor en lugar de la página.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los ficheros con hash en el nombre no cambian nunca: se pueden cachear para
  # siempre. El index no, o una versión nueva tardaría en verse.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
